[project]
name = "chapkit_timestral_tsfm"
version = "0.1.0"
description = "ML service for chapkit_timestral_tsfm"
requires-python = ">=3.13"
dependencies = [
    "chapkit>=2.5.0,<3",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    # Add your ML library here (e.g., "scikit-learn>=1.6.1", "tensorflow>=2.17.0")
    "timestral",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
timestral = { git = "https://github.com/mistralai/timestral.git" }

# CPU-only torch on Linux (Docker); the default PyPI wheel pulls several GB of CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
